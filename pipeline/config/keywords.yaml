# Termos que definem o nicho da Alchemia Solutions para filtro de relevância e construção de
# queries. Editável sem tocar em código Python — qualquer coletor que precise de um filtro de
# relevância client-side importa esta lista via common.load_keywords().
#
# "topics" é usado para: (1) filtro de relevância em feeds genéricos (empresas grandes cujo
# conteúdo não é 100% do nicho, ex. OpenAI/NVIDIA/Microsoft/Anthropic/DeepMind); (2) tag
# `keywords_matched` em cada item coletado, para auditabilidade (nunca uma classificação opaca —
# ver spec 2026-08-17, Critérios de Sucesso).
topics:
  - drug discovery
  - drug design
  - computer-aided drug design
  - CADD
  - AI drug discovery
  - virtual screening
  - molecular docking
  - de novo drug design
  - generative chemistry
  - protein engineering
  - protein design
  - protein language model
  - antibody engineering
  - antibody design
  - vaccine design
  - AlphaFold
  - RFdiffusion
  - ADMET
  - cheminformatics
  - molecular dynamics
  - QSAR
  - target identification
  - natural products chemistry
  - biotech AI
  - foundation model biology
  - genomics AI
  - computational chemistry
  - drug repurposing
  - small molecule design
  - biologics design
  - structure-based drug design
  - fragment-based drug design
  - deep learning chemistry
  - machine learning drug discovery
  - diffusion model protein
  - docking software
  - free energy perturbation
  - ADMET prediction
  - chemical space exploration
  - active learning chemistry
  - drug-likeness

  # Adicionados 2026-09-03 (rotina do Baker, 06:50) — justificados por padrão MEDIDO nos dados,
  # não por palpite. Os dois eram os termos mais recorrentes entre os artigos que chegavam com
  # `keywords_matched` VAZIO (o sinal de termo candidato previsto pela rotina): juntos rotulam
  # 45 dos 134 artigos hoje sem termo. Contagem na base no momento da adição:
  #   - "in silico": 217 artigos (23 hoje sem termo) — termo central de CADD, ausente por
  #     omissão desde a redação original; é o mais frequente dos não-rotulados recentes.
  #   - "network pharmacology": 129 artigos (22 hoje sem termo).
  # Risco de inundação avaliado antes de adicionar (é o critério do `filter_relevance` em feeds
  # generalistas): 11 e 1 ocorrências no lado de NOTÍCIAS, respectivamente — desprezível.
  - in silico
  - network pharmacology

  # 2026-09-04 (rotina do Baker, manha) -- PRIMEIROS TERMOS EM PORTUGUES da lista.
  # Motivo medido, nao palpite: os 43 termos acima sao TODOS em ingles, e o mesmo `topics`
  # alimenta o `filter_relevance` de fontes BRASILEIRAS (butantan, fiocruz, SciELO). Isso
  # criava um ponto cego real: um anuncio de CADD publicado em portugues nunca casava.
  # Prova encontrada no historico de 320 itens do Butantan -- exatamente 1 item relevante,
  # invisivel para todos os 43 termos ingleses:
  #   "Pos-doutorado em descoberta de farmacos no Instituto Butantan" (Agencia FAPESP)
  # Ruido medido ANTES de adicionar (mesmo criterio usado para "in silico"/"network
  # pharmacology" acima): aplicados as 60 obras da janela do SciELO, os dois termos admitem
  # 0 (zero) itens novos -- nao ha risco de inundacao. Cap da rotina respeitado: 2 termos.
  # Sao os equivalentes PT diretos de "drug discovery" e "drug design", ja no topo da lista.
  - descoberta de fármacos
  - planejamento de fármacos

# Query compacta usada pelo coletor PubMed (E-utils), ancorada no nicho de IA+CADD — evita o
# ruído de "drug discovery" genérico (majoritariamente clínico/regulatório, não computacional).
pubmed_query: >-
  ("computer-aided drug design"[Title/Abstract] OR "CADD"[Title/Abstract] OR
  "virtual screening"[Title/Abstract] OR "molecular docking"[Title/Abstract] OR
  "de novo drug design"[Title/Abstract] OR "generative chemistry"[Title/Abstract] OR
  "protein design"[Title/Abstract] OR "protein language model"[Title/Abstract] OR
  "antibody engineering"[Title/Abstract] OR "structure-based drug design"[Title/Abstract] OR
  ((drug discovery[Title/Abstract]) AND (artificial intelligence[Title/Abstract] OR
  machine learning[Title/Abstract] OR deep learning[Title/Abstract])) OR
  ((vaccine design[Title/Abstract]) AND (artificial intelligence[Title/Abstract] OR
  machine learning[Title/Abstract])))

# Query do arXiv (Atom API) -- categorias relevantes + termos do nicho no título/resumo.
arxiv_categories:
  - q-bio.BM
  - q-bio.QM
  - q-bio.MN
arxiv_query_terms:
  - drug discovery
  - drug design
  - molecular docking
  - protein design
  - protein structure prediction
  - de novo design
  - generative model molecule
  - antibody design
  - virtual screening
  - cheminformatics

# Frases em português usadas nas passadas Google News em pt-BR (foco Brasil/instituições).
google_news_queries_pt:
  - '"inteligência artificial" "descoberta de fármacos"'
  - '"inteligência artificial" "design de fármacos"'
  - 'biologia computacional (fármacos OR medicamentos)'
  - '"Instituto Butantan" (pesquisa OR vacina OR "inteligência artificial")'
  - '"Fiocruz" ("inteligência artificial" OR vacina OR fármaco)'

# Frases em inglês para a rotação Google News genérica (não ligada a uma empresa específica).
google_news_queries_en:
  - '"AI drug discovery"'
  - '"computer-aided drug design"'
  - '"generative chemistry" AI'
  - '"protein design" AI'
  - '"de novo drug design"'
  - '"antibody engineering" AI'
  - '"virtual screening" AI pharma'
  - '"AlphaFold" drug discovery'
  - '"AI vaccine design"'
  - '"molecular docking" AI'
