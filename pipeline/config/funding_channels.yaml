# Catálogo curado de canais de fomento à pesquisa, inovação e startups relevantes para a
# Alchemia Solutions -- alimenta a página "/fomento" do dashboard. Conteúdo estático (não
# coletado automaticamente), transcrito e resumido em palavras próprias a partir de
# `canais-editais-fomento-brasil.md` (guia de referência do fundador, ago/2026, arquivo original
# em pasta local de Downloads do fundador). Cada entrada tem link para o portal oficial -- valores,
# prazos e regras mudam a cada edição: sempre confirmar no canal oficial antes de qualquer decisão
# de submissão (mesmo aviso que o próprio guia carrega). Nenhum dado aqui é "aberto agora" --
# monitoramento ativo de chamadas é Fase 2 (backlog), não implementada.
#
# Ver docs/specs/2026-08-19-funding-opportunities-and-app-restructure.md para o schema completo.
#
# scope: federal | estadual_sp | saude | universidade_ict | fundacao_privada | internacional
#
# priority_alchemia herdado da seção 9 do guia ("Notas específicas para uma organização de
# biotech/CADD com projeto em oncologia molecular", que já ranqueia "alta"/"média" para 10 itens
# específicos) -- nunca inventado por esta curadoria. "complementar" é usado só para canais que a
# seção 9 do guia não classifica (a nota de cada entrada deixa isso explícito).
#
# Requisitos estruturais gerais que o guia lista como transversais a boa parte dos editais
# federais/estaduais (seção 9, bloco "Estruturais") e que não estão repetidos em toda entrada:
# manter CNPJ com CNAE de P&D, Currículo Lattes atualizado dos pesquisadores-chave, e -- para
# qualquer edital com dado de paciente -- aprovação em CEP/CONEP e registro na Plataforma Brasil
# (prazo de 60-120 dias, frequentemente o gargalo real, não a submissão em si).

funding_channels:
  # ---------------------------------------------------------------------------------------------
  # 1. FEDERAL
  # ---------------------------------------------------------------------------------------------
  - slug: cnpq
    name: "CNPq"
    full_name: "Conselho Nacional de Desenvolvimento Científico e Tecnológico"
    scope: federal
    portal_url: "https://www.gov.br/cnpq/pt-br"
    calls_url: "https://www.gov.br/cnpq/pt-br/chamadas/abertas-para-submissao"
    programs:
      - name: "RHAE — Pesquisador na Empresa"
        note: "Bolsas de RH para empresas — muito relevante para startups"
      - name: "Chamada Universal"
        note: "A mais ampla; ciclos historicamente bienais"
      - name: "Bolsas de Produtividade (PQ) e Desenvolvimento Tecnológico (DT)"
        note: "Geralmente abrem no 2º semestre"
      - name: "INCT — Institutos Nacionais de Ciência e Tecnologia"
        note: "Grandes ciclos plurianuais"
      - name: "PIBIC / PIBITI / PIBIC-Af"
        note: "Via cota institucional — checar edital interno da ICT parceira"
      - name: "Chamadas CNPq/Decit-SCTIE/MS, CNPq/MCTI/FNDCT, CNPq/ERC, BRICS-STI"
        note: "Executadas via CNPq — a linha de Saúde das Mulheres vive aqui, ver entrada ministerio-saude-decit"
    priority_alchemia: complementar
    priority_note: >-
      Não classificado individualmente na seção 9 do guia (que prioriza especificamente a linha
      CNPq/Decit-SCTIE/MS — Saúde das Mulheres, coberta na entrada "ministerio-saude-decit") —
      incluído por cobertura, sem prioridade própria herdada.
    requires: ["Currículo Lattes atualizado", "muitas chamadas exigem ICT parceira formalizada"]
    source_guide: canais-editais-fomento-brasil.md
    last_reviewed: "2026-08-19"

