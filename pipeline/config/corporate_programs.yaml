  - slug: cnpem-lnbio
    name: "CNPEM / LNBio"
    category: habitat_nacional
    region: brasil
    portal_url: "https://cnpem.br"
    benefit_summary: >-
      "A infraestrutura de pesquisa mais poderosa disponível a empresas brasileiras" (Campinas,
      organização social supervisionada pelo MCTI). Duas vias de acesso: (1) chamada pública do
      Sirius para tempo de feixe — acadêmica, gratuita, avaliação por pares, contrapartida de
      publicação aberta; (2) Assessoria de Inovação (AIN) para empresas — contratação de projetos
      colaborativos com sigilo e propriedade intelectual negociada, sem edital. O LNBio oferece
      proteômica por espectrometria de massas, caracterização de proteínas (ITC/DSF), RMN,
      cristalografia (linhas MANACÁ do Sirius) e triagem de compostos — parceiro natural para
      validação experimental de predições computacionais de CADD.
    eligibility_summary: >-
      Via Sirius: pesquisadores de instituições brasileiras e de países da América Latina/Caribe,
      com contrapartida de publicação aberta dos resultados. Via AIN: prospecção e negociação
      direta com empresas, sem edital formal — processo de relacionamento longo, "comece cedo"
      (recomendação do guia).
    priority_alchemia: alta
    priority_note: >-
      Aparece duas vezes na seção 10 do guia: bloco "Prioridade máxima" (item 3, via AIN) — "abrir
      conversa sobre validação experimental de predições computacionais" — e bloco "Prioridade
      alta" (item 7, via chamada do Sirius). Usada a classificação mais alta das duas menções
      (alta = "Prioridade máxima" no mapeamento desta curadoria).
    source_guide: guia-captacao-programas-corporativos-startups.md
    last_reviewed: "2026-08-19"

  - slug: supera-parque
    name: "SUPERA Parque de Inovação e Tecnologia"
    category: habitat_nacional
    region: sp
    portal_url: "https://www.superaparque.com.br"
    benefit_summary: >-
      Convênio Prefeitura de Ribeirão Preto + USP (gestão FIPASE), vocação declarada em saúde,
      biotecnologia, TI e agronegócio — melhor aderência a healthtech/biotech fora do eixo São
      Paulo capital. ~378 mil m² dentro do campus USP-RP, ~94 empresas instaladas (59 na
      incubadora) em 2026. Incubação gratuita — Jornada SUPERA, ~24 meses, 3 módulos (Projeto →
      Startup → Empresa) — com mentorias individuais, capacitações técnicas, infraestrutura
      física, SUPERALab (inovação aberta) e International Office; ou Membership (acesso à rede sem
      incubação, para empresas já constituídas).
    eligibility_summary: >-
      Processo seletivo periódico (historicamente semestral; selecionou 12 startups em 2026),
      cinco etapas: inscrição online → entrevistas comportamentais/de negócios → elaboração da
      proposta → banca → análise final. Candidatos não selecionados recebem mentoria individual
      de feedback — o guia recomenda se inscrever mesmo sem certeza de aprovação.
    priority_alchemia: media
    priority_note: >-
      Bloco "Prioridade alta" do guia (seção 10, item 5) — "vocação explícita em saúde e biotech,
      dentro do campus da USP-RP, geograficamente próximo ao polo oncológico de Barretos; o selo
      de incubação é reconhecido em avaliação de PIPE/FAPESP."
    source_guide: guia-captacao-programas-corporativos-startups.md
    last_reviewed: "2026-08-19"

