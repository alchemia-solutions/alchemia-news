# Catálogo curado de programas corporativos para startups (créditos de nuvem, SaaS, aceleradoras,
# parques tecnológicos, hubs de inovação) relevantes para a Alchemia Solutions -- alimenta a
# página "/programas" do dashboard. Conteúdo estático (não coletado automaticamente), transcrito e
# resumido em palavras próprias a partir de `guia-captacao-programas-corporativos-startups.md`
# (guia de referência do fundador, ago/2026, arquivo original em
# C:\Users\AryelBezerra\Downloads\). Cada entrada tem link para o portal oficial.
#
# Aviso do próprio guia (seção 0), preservado aqui: "os tetos de crédito mudam a cada trimestre e
# variam por tier, região e elegibilidade. Os números são direcionais... confirme sempre na página
# oficial antes de planejar orçamento em cima deles." Nenhum valor citado nesta UI deve aparecer
# sem esse qualificador.
#
# Ver docs/specs/2026-08-19-funding-opportunities-and-app-restructure.md para o schema completo.
#
# category: cloud_credits | saas_discount | accelerator_no_equity | accelerator_equity |
#           habitat_nacional | hub_corporativo
# region: global | brasil | sp
#
# priority_alchemia herdado da seção 10 do guia ("Aderência ao perfil de biotech/CADD com projeto
# em oncologia molecular"), que tem 3 blocos explícitos: "Prioridade máxima" (mapeado para
# `alta`), "Prioridade alta" (mapeado para `media`) e "Complementares" (mapeado para
# `complementar`) -- essa é a única forma de encaixar os 3 blocos do guia nos 3 valores do schema
# sem inventar nada; cada `priority_note` cita o bloco original por extenso para nunca perder essa
# distinção. Programas não mencionados na seção 10 recebem `complementar` com nota explícita de
# que não foram ranqueados pelo guia (não confundir com o bloco "Complementares" do próprio guia).

corporate_programs:
  # ---------------------------------------------------------------------------------------------
  # PARTE I — PROGRAMAS INTERNACIONAIS
  # 1. Créditos de nuvem e computação
  # ---------------------------------------------------------------------------------------------
  - slug: google-for-startups-cloud
    name: "Google for Startups Cloud Program"
    category: cloud_credits
    region: global
    portal_url: "https://cloud.google.com/startup"
    benefit_summary: >-
      Maior teto publicado do mercado em 2026 para startups AI-first. Três tiers direcionais:
      Start (até ~US$2.000 em créditos GCP/Firebase), Scale (até ~US$200.000 em 2 anos) e AI-First
      (até ~US$350.000 em 2 anos). Cobre Vertex AI, Gemini/Gemma, TPUs, BigQuery, GKE, Cloud Run e
      storage — modelos de terceiros são cobrados à parte. Atenção ao "penhasco do ano 2": a
      cobertura costuma cair de ~100% para ~20% no segundo ano.
    eligibility_summary: >-
      Start: startup de tecnologia, fundada há menos de 5 anos, sem investidor institucional.
      Scale: rodada pré-seed a Série A institucional (SAFE conta; grants governamentais,
      crowdfunding, anjo e F&F não contam). AI-First: uso de Vertex AI/Gemini como base do
      produto, funding VC seed–Série A, fundada há menos de 10 anos, sem ter recebido mais de
      US$5.000 em créditos GCP prévios.
    priority_alchemia: alta
    priority_note: >-
      Bloco "Prioridade máxima" do guia (seção 10, item 4) — "se houver componente AI-first no
      produto, mapear o caminho até o tier de US$350 mil."
    source_guide: guia-captacao-programas-corporativos-startups.md
    last_reviewed: "2026-08-19"

  - slug: aws-activate
    name: "AWS Activate"
    category: cloud_credits
    region: global
    portal_url: "https://aws.amazon.com/activate"
    benefit_summary: >-
      Três tiers direcionais: Founders (autoatendimento, sem VC/aceleradora, créditos na casa de
      US$1.000–5.000), Portfolio (até ~US$100.000, exige "Organization ID" de VC/aceleradora/
      incubadora parceira) e Generative AI (até ~US$300.000 para startups de IA qualificadas).
      Programas relacionados: AWS for Health / Healthcare Accelerator, AWS Health Equity
      Initiative.
    eligibility_summary: >-
      Site funcional com domínio próprio, e-mail corporativo no domínio, deck/descrição do
      produto, data de fundação, headcount. O tier Portfolio exige Organization ID — entrar no
      NVIDIA Inception é uma das formas de destravá-lo (ver entrada nvidia-inception).
    priority_alchemia: complementar
    priority_note: >-
      Não classificado na seção 10 do guia (aparece como passo 3 da sequência de "credit
      stacking" da seção 8) — incluído por cobertura obrigatória do catálogo, sem prioridade
      própria herdada.
    source_guide: guia-captacao-programas-corporativos-startups.md
    last_reviewed: "2026-08-19"

  - slug: microsoft-founders-hub
    name: "Microsoft for Startups Founders Hub"
    category: cloud_credits
    region: global
    portal_url: "https://www.microsoft.com/startups"
    benefit_summary: >-
      O programa mais acessível dos três grandes — não exige VC nem aceleradora para começar.
      Estágios direcionais: Ideate (~US$1.000, autoaplicação imediata), Build (~US$5.000–25.000,
      após verificação de negócio), Grow (~US$25.000–50.000), Scale (~US$120.000–150.000, via
      Investor Network/código de aceleradora). Além dos créditos Azure: GitHub Enterprise, M365
      Business Premium, LinkedIn Premium, Azure OpenAI Service e sessões com especialistas
      técnicos.
    eligibility_summary: >-
      Exige conta Microsoft pessoal (MSA), não corporativa/escolar. Verificação de negócio em até
      90 dias, sob pena de perder parte dos créditos. Créditos começam a expirar a partir da
      ativação — não ativar antes de estar pronto para consumir. Não cobre licenças M365,
      Dynamics, Power BI Pro nem Azure Marketplace.
    priority_alchemia: alta
    priority_note: >-
      Bloco "Prioridade máxima" do guia (seção 10, item 2) — "tier de entrada imediato, sem
      exigência de investidor; cobre infraestrutura enquanto os editais públicos não saem."
    source_guide: guia-captacao-programas-corporativos-startups.md
    last_reviewed: "2026-08-19"

  - slug: nvidia-inception
    name: "NVIDIA Inception"
    category: cloud_credits
    region: global
    portal_url: "https://www.nvidia.com/en-us/startups/"
    benefit_summary: >-
      Gratuito, sem equity, sem prazo e sem coorte. Créditos do Deep Learning Institute, preço
      preferencial em hardware/software, acesso a NIM/SDKs, créditos de nuvem via parceiros (rotas
      documentadas para AWS Activate e Nebius), Inception Capital Connect (rede de VCs), badge e
      co-marketing. Stack BioNeMo (modelos de linguagem para proteínas, docking, geração
      molecular) e Clara (imagem médica, genômica) — diretamente aplicável a CADD.
    eligibility_summary: >-
      Empresa constituída em qualquer país (CNPJ brasileiro elegível), menos de 10 anos de
      fundação, pelo menos um desenvolvedor no time, site funcional. Receita não é requisito.
      Não elegíveis: consultorias/software houses terceirizadas, empresas de criptomoedas,
      provedores de nuvem, revendas, capital aberto. Regra de ouro: candidatar-se como empresa de
      produto de IA, nunca como prestadora de serviço — principal causa de rejeição. Decisão em
      2–4 semanas; perfil deve ser atualizado a cada 6 meses para manter elegibilidade.
    priority_alchemia: alta
    priority_note: >-
      Bloco "Prioridade máxima" do guia (seção 10, item 1) — "fazer nas próximas semanas";
      "acesso ao stack BioNeMo/Clara é diretamente aplicável a descoberta de fármacos assistida
      por computador. Sem custo, sem equity, sem prazo."
    source_guide: guia-captacao-programas-corporativos-startups.md
    last_reviewed: "2026-08-19"

