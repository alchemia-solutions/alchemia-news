name: Coleta Alchemia News

# Roda a Etapa 1a (coleta determinística) + Etapa 3 (sync Supabase) na infraestrutura do
# próprio GitHub -- não depende da máquina local do fundador estar ligada. Escopo deliberadamente
# igual ao que já rodava local via run_alchemia_news.cmd nessas duas etapas, nada mais.
#
# Fora de escopo, de propósito (continuam só na máquina local, ver AGENTS.md deste setor):
#   - Etapa 1b (research_export -- escreve em alchemia-science/alchemia-library, pasta fora
#     deste repositório, sem equivalente em nuvem hoje).
#   - Etapas 2-3 do lado "curadoria"/"newsletter" (rodam como Tarefas Agendadas do Claude,
#     precisam do app aberto -- migração separada, não pedida ainda).
#
# Sem LLM em nenhum passo -- mesma garantia determinística que a spec deste setor exige para
# coleta. Custo: minutos de GitHub Actions (repositório privado), não crédito de IA.

on:
  schedule:
    # 06:40 / 12:40 / 18:40 America/Sao_Paulo (Brazil/East, UTC-3) == 09:40 / 15:40 / 21:40 UTC.
    # Mesmos três horários da Tarefa Agendada local "Alchemia News - Coleta".
    - cron: "40 9 * * *"
    - cron: "40 15 * * *"
    - cron: "40 21 * * *"
  workflow_dispatch: {} # permite disparo manual pela aba Actions, para testar

concurrency:
  group: alchemia-news-coleta
  cancel-in-progress: false

permissions:
  contents: write # necessário para commitar pipeline/data/*.json de volta no repo

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: "Etapa 1a -- coleta determinística"
        run: python -m pipeline.run_all
        env:
          PYTHONIOENCODING: utf-8

      - name: "Etapa 3 -- sincronizar Supabase"
        run: python -m pipeline.sync_supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Persistir estado da coleta (commit pipeline/data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "chore(pipeline): coleta automática $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
